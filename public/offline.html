<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F4D45" />
    <title>Offline — HakiScribe</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1ea;
        --ink: #1f2a24;
        --muted: #5c6a63;
        --primary: #1f4d45;
        --card: #fffcf7;
        --border: #d9d2c5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(900px 420px at 10% -10%, rgba(31, 77, 69, 0.12), transparent 55%),
          var(--bg);
        color: var(--ink);
      }
      main {
        width: min(28rem, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.75rem 1.5rem;
        box-shadow: 0 18px 40px -28px rgba(31, 42, 36, 0.45);
      }
      .mark {
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 0.6rem;
        background: var(--primary);
        display: grid;
        place-items: center;
        margin-bottom: 1.1rem;
      }
      .mark img { width: 1.45rem; height: 1.45rem; filter: brightness(0) invert(1); }
      h1 {
        margin: 0;
        font-size: 1.65rem;
        line-height: 1.2;
        font-weight: 600;
      }
      p {
        margin: 0.85rem 0 0;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        font-size: 0.95rem;
        line-height: 1.55;
        color: var(--muted);
      }
      a {
        display: inline-flex;
        margin-top: 1.35rem;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1.1rem;
        border-radius: 0.55rem;
        background: var(--primary);
        color: #f7faf8;
        text-decoration: none;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        font-size: 0.92rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <img src="/favicon.png" alt="" />
      </div>
      <h1>HakiScribe needs a connection</h1>
      <p>
        The secure legal workspace is offline right now. Recording, verification, and generated work
        require the live service — privileged records are never stored in this offline shell.
      </p>
      <p>Reconnect, then return to the workspace.</p>
      <a href="/">Back to HakiScribe</a>
    </main>
  </body>
</html>
