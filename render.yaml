services:
  - type: web
    name: hakiscribe-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: hakiscribe-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - hakiscribe-backend/**
        - render.yaml
    envVars:
      # Required once, on first Blueprint create. Captions, detect, draft,
      # and Ask all share this key. Model slugs like openai/gpt-4o are
      # OpenRouter IDs, not a second vendor account.
      - key: OPENROUTER_API_KEY
        sync: false
      # Protects /internal/* so Trigger.dev can call back. Generated here
      # so the same value is available without committing a secret.
      - key: BACKEND_INTERNAL_SECRET
        generateValue: true
      # Public URL Trigger.dev and Exa monitors use to reach this service.
      # Code falls back to EXA_MONITOR_WEBHOOK_URL or {this}/webhooks/exa.
      - key: BACKEND_INTERNAL_URL
        value: https://hakiscribe-backend.onrender.com
      - key: ASR_PROVIDER
        value: openrouter
      - key: ASR_MODEL
        value: openai/whisper-large-v3
      - key: DETECTION_MODEL
        value: openai/gpt-4o
      - key: DRAFTING_MODEL
        value: openai/gpt-4o
      - key: ASK_MODEL
        value: openai/gpt-4o
      # Dashboard-only (do not add as sync: false — that makes them
      # mandatory on first deploy). Each no-ops or has a code default:
      #   EXA_API_KEY, EXA_MONITOR_WEBHOOK_URL
      #   AMBIGUOUS_API_KEY, AMBIGUOUS_CALENDAR_ID, AMBIGUOUS_NOTIFY_CHANNEL
      #   TRIGGER_SECRET_KEY, OMI_SHARED_SECRET
      #   GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET
      #   DROPBOX_APP_KEY, DROPBOX_APP_SECRET
      #   MICROSOFT_CLIENT_ID, MICROSOFT_CLIENT_SECRET, MICROSOFT_TENANT_ID
      #   GOOGLE_CALENDAR_ID, GOOGLE_CALENDAR_TIMEZONE, OAUTH_REDIRECT_BASE_URL
      # Connector sign-in callback to register with each provider:
      #   https://hakiscribe-backend.onrender.com/integrations/oauth/{provider}/callback
      #   OPENAI_API_KEY, GROQ_API_KEY  (only if you change ASR_PROVIDER)
