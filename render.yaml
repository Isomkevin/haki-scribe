services:
  - type: web
    name: hakiscribe-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: hakiscribe-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - hakiscribe-backend/**
        - render.yaml
    envVars:
      - key: ASR_PROVIDER
        value: openai
      - key: DETECTION_MODEL
        value: openai/gpt-4o
      - key: DRAFTING_MODEL
        value: openai/gpt-4o
      - key: AMBIGUOUS_NOTIFY_CHANNEL
        value: general
      # GPT detection/drafting goes through OpenRouter. The openai/ prefix
      # on the model names is an OpenRouter slug, not a second vendor key.
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional: add OPENAI_API_KEY in the Dashboard later if you want
      # live Whisper captions. Without it, ASR no-ops and the rest of
      # the pipeline still works.
      - key: BACKEND_INTERNAL_SECRET
        generateValue: true
